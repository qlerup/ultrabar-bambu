name: Build and protocol tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test protocol, telemetry and pinned TLS against a fake printer
        run: python test.py
      - name: Build release-mode APK with disposable CI key
        shell: bash
        run: |
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/ci-signing.jks"
          export ANDROID_KEY_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          sdkmanager 'build-tools;35.0.0' 'platforms;android-35' >/dev/null
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE" -storepass:env ANDROID_KEY_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -alias ci -keyalg RSA -validity 2 -dname 'CN=Disposable CI test key'
          python build.py
      - name: Check compiled launcher, permissions and embedded settings
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/app.apk
          python -c "import json,zipfile; z=zipfile.ZipFile('dist/app.apk'); assert json.loads(z.read('assets/studio-settings.json')) == json.load(open('studio-settings.json')); assert z.read('classes.dex').startswith(bytes([100,101,120,10]))"
